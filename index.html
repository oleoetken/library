<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="container"></div>
    <button command="show-modal" commandfor="my-dialog">New Book</button>

    <dialog id="my-dialog">
        <form method="dialog">
            <p>
                <label>
                    Title: 
                    <input type="text" />
                </label>
            </p>
            <p>
                <label>
                    Author:
                    <input type="text" />
                </label>
            </p>
            <p>
                <label>
                    Pages:
                    <input type="text" />
                </label>
            </p>
            <p>
                <label>
                    Read:
                    <input type="text" />
                </label>
            </p>
        </form>
        <p>
            <button commandfor="my-dialog" command="close">Close</button>
        </p>
    </dialog>
</body>
</html>
