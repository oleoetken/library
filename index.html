<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="container"></div>
    <button id="showDialog">New Book</button>

    <dialog id="dialogForm">
        <form method="dialog">
            <p>
                <label>
                    Title: 
                    <input type="text" />
                </label>
            </p>
            <p>
                <label>
                    Author:
                    <input type="text" />
                </label>
            </p>
            <p>
                <label>
                    Pages:
                    <input type="text" />
                </label>
            </p>
            <p>
                <label>
                    Read:
                    <input type="text" />
                </label>
            </p>
            <button id="closeButton">Close</button>
            <input type="submit" id="submitButton" value="Add" />
        </form>
    </dialog>
</body>
</html>
